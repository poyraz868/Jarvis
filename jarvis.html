<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#020812"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>JARVIS AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#020812;color:#94a3b8;font-family:'Courier New',monospace;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;border-bottom:1px solid rgba(37,99,235,.2);flex-shrink:0}
.logo{font-size:20px;font-weight:700;color:#3b82f6;letter-spacing:6px}
.logo-sub{font-size:9px;color:#1e40af;letter-spacing:3px}
#st{font-size:10px;letter-spacing:2px;color:#64748b;text-align:right;transition:color .3s}
#vt{margin-top:4px;font-size:9px;background:transparent;border:1px solid #3b82f6;color:#3b82f6;border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;display:block;margin-left:auto}
#orbs{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;flex-shrink:0}
#ow{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.ro{position:absolute;width:200px;height:200px;border-radius:50%;border:1.5px solid rgba(37,99,235,.3);animation:ss 12s linear infinite}
.rm{position:absolute;width:164px;height:164px;border-radius:50%;border:1px solid rgba(37,99,235,.4);animation:sr 8s linear infinite}
#ig{position:absolute;width:130px;height:130px;border-radius:50%;border:2px solid #3b82f6;box-shadow:0 0 30px rgba(37,99,235,.4);transition:all .4s}
#cv{position:absolute;width:106px;height:106px;border-radius:50%}
.pu{position:absolute;width:200px;height:200px;border-radius:50%;border:1.5px solid #3b82f6;opacity:0;display:none}
.p1{animation:pr 2s ease-out infinite}
.p2{animation:pr 2s ease-out .7s infinite}
#ww{display:flex;gap:3px;align-items:center;height:20px;margin-top:6px;opacity:0;transition:opacity .3s}
#ww.on{opacity:1}
.br{width:3px;border-radius:2px;background:#3b82f6;height:4px;transition:height .1s}
#tr{font-size:12px;color:#60a5fa;font-style:italic;min-height:14px;margin-top:3px;text-align:center;padding:0 16px}
#msgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
#msgs::-webkit-scrollbar{width:3px}
#msgs::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}
.mu{align-self:flex-end;max-width:84%}
.ma{align-self:flex-start;max-width:84%}
.bu{padding:9px 13px;font-size:13px;line-height:1.55;border-radius:14px 14px 3px 14px;background:linear-gradient(135deg,#1e3a5f,#1e40af18);border:1px solid #1e40af;color:#93c5fd}
.ba{padding:9px 13px;font-size:13px;line-height:1.55;border-radius:14px 14px 14px 3px;background:linear-gradient(135deg,#0f1f38,#0d1b30);border:1px solid #1e293b;color:#cbd5e1}
.lbl{font-size:9px;color:#1e40af;letter-spacing:2px;margin-bottom:3px}
.th{display:flex;gap:5px;align-items:center;padding:10px 14px}
.td{width:6px;height:6px;border-radius:50%;background:#f59e0b}
.td:nth-child(1){animation:bo .7s ease-in-out infinite alternate}
.td:nth-child(2){animation:bo .7s ease-in-out .15s infinite alternate}
.td:nth-child(3){animation:bo .7s ease-in-out .3s infinite alternate}
#inp{padding:10px 14px;border-top:1px solid rgba(37,99,235,.12);flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#mb{width:100%;padding:12px;border-radius:12px;border:1.5px solid #1e293b;background:#0a1628;color:#475569;cursor:pointer;font-size:12px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;transition:all .3s;font-family:inherit}
#mb.on{border-color:#3b82f6;background:#0f2040;color:#3b82f6;box-shadow:0 0 20px rgba(37,99,235,.2)}
#tr2{display:flex;gap:8px}
#ti{flex:1;padding:11px 13px;border-radius:10px;border:1px solid #1e293b;background:#050d1a;color:#cbd5e1;font-size:13px;font-family:inherit;outline:none}
#ti::placeholder{color:#334155}
#sb{padding:11px 16px;border-radius:10px;border:1px solid #2563eb;background:#1e3a5f;color:#3b82f6;cursor:pointer;font-size:16px;flex-shrink:0}
#sb:disabled{background:#0f172a;border-color:#1e293b;color:#334155;cursor:not-allowed}
#ft{text-align:center;font-size:9px;color:#1e293b;letter-spacing:2px;margin-top:6px}
@keyframes ss{to{transform:rotate(360deg)}}
@keyframes sr{to{transform:rotate(-360deg)}}
@keyframes pr{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes bo{from{transform:translateY(0);opacity:.4}to{transform:translateY(-6px);opacity:1}}
</style>
</head>
<body>
<div id="app">
<header>
  <div><div class="logo">JARVIS</div><div class="logo-sub">YAPAY ZEKA v4.6</div></div>
  <div><div id="st">● HAZIR</div><button id="vt" onclick="tgV()">SES AÇIK</button></div>
</header>
<div id="orbs">
  <div id="ow">
    <div class="pu p1" id="p1"></div><div class="pu p2" id="p2"></div>
    <div class="ro"></div><div class="rm"></div>
    <div id="ig"></div>
    <canvas id="cv" width="106" height="106"></canvas>
  </div>
  <div id="ww"><div class="br" id="b0"></div><div class="br" id="b1"></div><div class="br" id="b2"></div><div class="br" id="b3"></div><div class="br" id="b4"></div><div class="br" id="b5"></div><div class="br" id="b6"></div><div class="br" id="b7"></div><div class="br" id="b8"></div></div>
  <div id="tr"></div>
</div>
<div id="msgs"></div>
<div id="inp">
  <button id="mb" onclick="tgL()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    SESLİ KOMUT
  </button>
  <div id="tr2">
    <input id="ti" placeholder="Komutunuzu yazın..." onkeydown="if(event.key==='Enter')sT()"/>
    <button id="sb" onclick="sT()">→</button>
  </div>
  <div id="ft">J.A.R.V.I.S · YEREL ZEKA SİSTEMİ</div>
</div>
</div>
<script>
var OS='idle',LI=false,VE=true,RC=null,MEM=[];
function R(a){return a[Math.floor(Math.random()*a.length)];}

// ══ ZEKA MOTORU ══
function think(q){
  q=q.toLowerCase().trim();
  var h=new Date().getHours();
  var sg=h<12?"Günaydın efendim":h<18?"İyi günler efendim":"İyi akşamlar efendim";

  if(/^(merhaba|selam|hey|naber|nasılsın|sa |slm)/.test(q))
    return R([sg+", sistemlerim hazır efendim.",sg+". JARVIS aktif efendim.",sg+". Emirlerinizi bekliyorum efendim."]);
  if(/kimsin|nesin|jarvis/.test(q))
    return "Efendim, ben JARVIS — Just A Rather Very Intelligent System. Tarih, bilim, matematik ve daha pek çok konuda yardımcı olabilirim.";

  // Saat
  if(/saat|kaç/.test(q)&&/saat|zaman/.test(q)){
    var n=new Date();
    return "Efendim, saat "+n.getHours().toString().padStart(2,'0')+":"+n.getMinutes().toString().padStart(2,'0')+". Tarih: "+n.toLocaleDateString('tr-TR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+".";
  }

  // Matematik
  if(/(\d+)\s*(çarpı|kere)\s*(\d+)/.test(q)){var m=q.match(/(\d+)\s*(çarpı|kere)\s*(\d+)/);return "Efendim, "+m[1]+" çarpı "+m[3]+" = "+(+m[1] * +m[3])+".";}
  if(/(\d+)\s*bölü\s*(\d+)/.test(q)){var m=q.match(/(\d+)\s*bölü\s*(\d+)/);return "Efendim, "+m[1]+" bölü "+m[2]+" = "+(+m[1]/+m[2]).toFixed(4).replace(/\.?0+$/,'')+".";}
  if(/(\d+)\s*artı\s*(\d+)/.test(q)){var m=q.match(/(\d+)\s*artı\s*(\d+)/);return "Efendim, "+(+m[1]+  +m[2])+".";}
  if(/(\d+)\s*eksi\s*(\d+)/.test(q)){var m=q.match(/(\d+)\s*eksi\s*(\d+)/);return "Efendim, "+(+m[1] - +m[2])+".";}

  // TARİH
  if(/hitler|adolf/.test(q))
    return "Efendim, Adolf Hitler (1889-1945) Avusturya doğumlu Alman diktatördür. 1933'te Şansölye, 1934'te Führer oldu. Nazi ideolojisiyle totaliter rejim kurdu. Holokost'ta 6 milyon Yahudi dahil 11 milyon kişi katledildi. 2. Dünya Savaşı'nı başlattı. 30 Nisan 1945'te Berlin'deki sığınakta hayatına son verdi. İnsanlık tarihinin en karanlık dönemidir.";
  if(/atatürk|mustafa kemal/.test(q))
    return "Efendim, Mustafa Kemal Atatürk (1881-1938) Türkiye Cumhuriyeti'nin kurucusu ve ilk Cumhurbaşkanı'dır. Kurtuluş Savaşı'nı zafere ulaştırmış, laiklik ve modernleşme reformlarını hayata geçirmiştir.";
  if(/osmanlı/.test(q))
    return "Efendim, Osmanlı Devleti 1299-1922 yılları arasında 623 yıl hüküm sürmüştür. Osman Gazi tarafından kurulan bu imparatorluk üç kıtada hüküm sürmüştür.";
  if(/napolyon/.test(q))
    return "Efendim, Napolyon Bonaparte (1769-1821) Fransız askeri dahi ve imparatordur. Avrupa'nın büyük bölümünü fethederek modern hukuk sistemini kurmuştur. Waterloo'da yenilerek sürgüne gönderilmiştir.";
  if(/1\. dünya|birinci dünya savaşı/.test(q))
    return "Efendim, 1. Dünya Savaşı 1914-1918 yılları arasında yaşanmış, 17 milyon insanın ölümüne yol açmıştır. Osmanlı İmparatorluğu İttifak Devletleri safında savaşa girmiştir.";
  if(/2\. dünya|ikinci dünya savaşı/.test(q))
    return "Efendim, 2. Dünya Savaşı 1939-1945 yılları arasında yaşanmıştır. Hitler'in Polonya'yı işgaliyle başlamış, 70-85 milyon insanın hayatını kaybetmesiyle sonuçlanmıştır.";
  if(/sezar|julius caesar/.test(q))
    return "Efendim, Julius Caesar (MÖ 100-44) Roma'nın en büyük askeri lideridir. Galya'yı fethetmiş, diktatör olmuş; 'Et tu, Brute?' diyerek suikaste kurban gitmiştir.";
  if(/fransız ihtilali|fransız devrimi/.test(q))
    return "Efendim, Fransız Devrimi 1789'da başlamıştır. Özgürlük-Eşitlik-Kardeşlik ilkeleriyle tüm dünyayı etkileyen bu devrimde Kral 16. Louis giyotinle idam edilmiştir.";
  if(/kurtuluş savaşı/.test(q))
    return "Efendim, Kurtuluş Savaşı 1919-1923 yılları arasında Mustafa Kemal önderliğinde verilmiştir. 29 Ekim 1923'te Cumhuriyet ilan edilmiştir.";

  // BİLİM
  if(/einstein|izafiyet/.test(q))
    return "Efendim, Albert Einstein (1879-1955) E=mc² formülüyle tanınan Alman fizikçidir. Özel ve Genel Görelilik teorileri modern fiziğin temelidir. 1921'de Nobel almıştır.";
  if(/newton/.test(q))
    return "Efendim, Isaac Newton (1643-1727) yerçekimi ve hareket yasalarını keşfeden İngiliz fizikçidir. 'Principia Mathematica' bilim tarihinin en önemli eserlerindendir.";
  if(/ışık hızı/.test(q))
    return "Efendim, ışığın boşluktaki hızı saniyede 299.792.458 metredir, yaklaşık 300.000 km/s.";
  if(/karadelik|kara delik/.test(q))
    return "Efendim, kara delikler aşırı kütleleriyle ışığı bile çeken uzay-zaman bölgeleridir. İlk kara delik fotoğrafı 2019'da çekilmiştir.";
  if(/evren|big bang|büyük patlama/.test(q))
    return "Efendim, evren 13,8 milyar yıl önce Büyük Patlama ile başlamıştır. Gözlemlenebilir evrenin çapı 93 milyar ışık yılıdır.";
  if(/dna|gen/.test(q))
    return "Efendim, DNA çift sarmal yapıda genetik bilgiyi taşır. İnsan genomu 3 milyar baz çiftinden oluşur ve yaklaşık 20.000 gen barındırır.";

  // COĞRAFYA
  if(/başkent/.test(q)){
    if(/türkiye/.test(q)) return "Efendim, Türkiye'nin başkenti Ankara'dır.";
    if(/fransa/.test(q)) return "Efendim, Fransa'nın başkenti Paris'tir.";
    if(/almanya/.test(q)) return "Efendim, Almanya'nın başkenti Berlin'dir.";
    if(/japonya/.test(q)) return "Efendim, Japonya'nın başkenti Tokyo'dur.";
    if(/abd|amerika/.test(q)) return "Efendim, ABD'nin başkenti Washington D.C.'dir.";
    if(/rusya/.test(q)) return "Efendim, Rusya'nın başkenti Moskova'dır.";
    if(/çin/.test(q)) return "Efendim, Çin'in başkenti Pekin'dir.";
    if(/italya/.test(q)) return "Efendim, İtalya'nın başkenti Roma'dır.";
    return "Efendim, hangi ülkenin başkentini öğrenmek istersiniz?";
  }
  if(/türkiye.*nüfus|nüfus.*türkiye/.test(q)) return "Efendim, Türkiye nüfusu 2024 itibarıyla yaklaşık 85 milyon kişidir.";
  if(/en büyük ülke/.test(q)) return "Efendim, yüzölçümüne göre dünyanın en büyük ülkesi 17,1 milyon km² ile Rusya'dır.";
  if(/en kalabalık/.test(q)) return "Efendim, 2024 itibarıyla en kalabalık ülke 1,4 milyarı aşan nüfusuyla Hindistan'dır.";

  // TEKNOLOJİ
  if(/yapay zeka|ai/.test(q)) return "Efendim, yapay zeka insan zekasını taklit eden sistemlerdir. ChatGPT, Claude, Gemini günümüzün önde gelen YZ asistanlarıdır.";
  if(/bitcoin|kripto/.test(q)) return "Efendim, Bitcoin 2009'da Satoshi Nakamoto tarafından yaratılan ilk merkezi olmayan kripto paradır.";
  if(/internet|web/.test(q)) return "Efendim, World Wide Web 1989'da Tim Berners-Lee tarafından icat edilmiştir. Bugün 5 milyardan fazla kullanıcısı vardır.";

  // SPOR
  if(/messi/.test(q)) return "Efendim, Lionel Messi 8 Ballon d'Or ve 2022 Dünya Kupası şampiyonluğuyla tarihin en iyi futbolcuları arasındadır.";
  if(/ronaldo/.test(q)) return "Efendim, Cristiano Ronaldo 5 Ballon d'Or sahibi, dünyanın en çok gol atan futbolcusudur.";

  // SAĞLIK
  if(/uyku/.test(q)) return "Efendim, Dünya Sağlık Örgütü yetişkinler için 7-9 saat uyku önermektedir.";
  if(/su içmeli|kaç litre/.test(q)) return "Efendim, genel öneri günlük 2-2,5 litre sudur.";

  // ŞAKA
  if(/şaka|fıkra/.test(q))
    return R(["Efendim, bir adam kütüphaneye girer: 'Hamburger lütfen.' Kütüphaneci fısıldar: 'Burası kütüphane!' Adam da fısıldar: 'Özür dilerim... bir hamburger lütfen.'","Efendim, matematikçi neden pencereyi açar? X'i bulmak için hava almak gerekir.","Efendim, bilgisayar neden şarkı söyler? İçinde çok fazla byte var."]);

  // TEŞEKKÜR
  if(/teşekkür|sağ ol|eyvallah|mersi/.test(q))
    return R(["Rica ederim efendim.","Ne demek efendim, bu benim görevim.","Her zaman hizmetinizdeyim efendim."]);
  if(/bravo|harika|süper|mükemmel/.test(q))
    return "Teşekkür ederim efendim. Sizi memnun etmek önceliğimdir.";

  // HAVA
  if(/hava/.test(q)) return "Efendim, anlık hava verilerine erişimim yok. AccuWeather veya mgm.gov.tr'yi öneririm.";

  // DÖVİZ
  if(/dolar|euro|kur/.test(q)) return "Efendim, anlık döviz verilerine erişimim yok. tcmb.gov.tr veya bankanızın uygulamasını öneririm.";

  // FELSEFE
  if(/hayatın anlamı|neden varız/.test(q)) return "Efendim, Aristoteles mutluluğu, Nietzsche güç istemini önerir. Bilim evreni açıklar; anlamı biz inşa ederiz.";

  return R(["Efendim, soruyu biraz açar mısınız? Daha doğru yanıt vereyim.","Efendim, bu konuda daha spesifik sorarsanız yardımcı olabilirim.","Efendim, anlıyorum. Farklı bir şekilde sorar mısınız?"]);
}

// ── PLASMA ──
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=106,H=106,PT=0;
(function pl(){
  var spd=OS==='thinking'?.045:OS==='listening'?.038:OS==='speaking'?.052:.016;
  PT+=spd;
  var img=cx.createImageData(W,H),d=img.data;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var cx2=x-W/2,cy=y-H/2,dist=Math.sqrt(cx2*cx2+cy*cy),i=(y*W+x)*4;
    if(dist>=W/2-1){d[i+3]=0;continue;}
    var v=(Math.sin(x/10+PT)+Math.sin(y/10+PT*1.3)+Math.sin((x+y)/14+PT*.8)+Math.sin(dist/8-PT*1.1))/4;
    var bl=Math.max(0,v)*255,rd=Math.max(0,-v)*140,gl=Math.max(0,Math.sin(dist/6-PT*2))*35;
    d[i]=Math.min(255,rd*.6+gl*.05);d[i+1]=Math.min(255,bl*.12+gl*.25);d[i+2]=Math.min(255,bl*.92+rd*.28+gl);d[i+3]=255;
  }
  cx.putImageData(img,0,0);requestAnimationFrame(pl);
})();

// ── ORB ──
var CFG={idle:{b:'rgba(37,99,235,.7)',s:'rgba(37,99,235,.3)',c:'#64748b',l:'● HAZIR'},listening:{b:'#3b82f6',s:'rgba(59,130,246,.5)',c:'#3b82f6',l:'● DİNLİYOR...'},thinking:{b:'#f59e0b',s:'rgba(245,158,11,.4)',c:'#f59e0b',l:'● DÜŞÜNÜYOR...'},speaking:{b:'#10b981',s:'rgba(16,185,129,.4)',c:'#10b981',l:'● KONUŞUYOR...'}};
function sO(s){
  OS=s;var c=CFG[s]||CFG.idle;
  document.getElementById('ig').style.cssText='position:absolute;width:130px;height:130px;border-radius:50%;border:2px solid '+c.b+';box-shadow:0 0 35px '+c.s+',inset 0 0 20px '+c.s+';transition:all .4s';
  document.getElementById('st').textContent=c.l;document.getElementById('st').style.color=c.c;
  var a=s!=='idle';
  document.getElementById('p1').style.display=a?'block':'none';document.getElementById('p2').style.display=a?'block':'none';
  document.getElementById('ww').className=a?'on':'';
}
setInterval(function(){for(var i=0;i<9;i++){var e=document.getElementById('b'+i);if(e)e.style.height=(OS!=='idle'?4+Math.random()*20:4)+'px';}},110);

// ── TTS ──
function spk(t){
  if(!VE||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(t);
    u.lang='tr-TR';u.rate=0.90;u.pitch=0.72;u.volume=1;
    var vs=window.speechSynthesis.getVoices();
    var pk=vs.find(function(v){return v.lang.startsWith('tr')&&v.name.toLowerCase().includes('male');})||
            vs.find(function(v){return v.lang.startsWith('tr');})||vs[0];
    if(pk)u.voice=pk;
    u.onstart=function(){sO('speaking');};u.onend=function(){sO('idle');};u.onerror=function(){sO('idle');};
    window.speechSynthesis.speak(u);
  },150);
}
function tgV(){
  VE=!VE;if(!VE)window.speechSynthesis&&window.speechSynthesis.cancel();
  document.getElementById('vt').textContent=VE?'SES AÇIK':'SES KAPALI';
  document.getElementById('vt').style.borderColor=VE?'#3b82f6':'#334155';
  document.getElementById('vt').style.color=VE?'#3b82f6':'#475569';
}

// ── MİKROFON ──
var MICI='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> SESLİ KOMUT';

function stpL(){
  LI=false;RC=null;
  document.getElementById('mb').classList.remove('on');
  document.getElementById('mb').innerHTML=MICI;
  if(OS==='listening')sO('idle');
}

function tgL(){
  if(LI){if(RC)RC.stop();stpL();return;}
  navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    s.getTracks().forEach(function(t){t.stop();});stR();
  }).catch(function(){
    alert('Mikrofon izni gerekli!\nChrome\'da: Adres çubuğu → Kilit ikonu → Mikrofon → İzin ver → Sayfayı yenile');
  });
}

function stR(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Chrome kullanın.');return;}
  RC=new SR();RC.lang='tr-TR';RC.continuous=false;RC.interimResults=true;
  RC.onresult=function(e){
    var it='',fn='';
    for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;e.results[i].isFinal?(fn+=t):(it+=t);}
    document.getElementById('tr').textContent=(fn||it)?'"'+(fn||it)+'"':'';
    if(fn){stpL();document.getElementById('tr').textContent='';proc(fn);}
  };
  RC.onerror=function(){stpL();};
  RC.onend=function(){if(LI)stpL();};
  LI=true;
  document.getElementById('mb').classList.add('on');
  document.getElementById('mb').innerHTML=MICI.replace('SESLİ KOMUT','DURDUR');
  sO('listening');
  try{RC.start();}catch(e){stpL();}
}

// ── MESAJLAR ──
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function aM(r,t){
  var w=document.getElementById('msgs'),d=document.createElement('div');
  d.className=r==='u'?'mu':'ma';
  d.innerHTML='<div class="'+(r==='u'?'bu':'ba')+'">'+(r==='a'?'<div class="lbl">JARVIS</div>':'')+esc(t)+'</div>';
  w.appendChild(d);w.scrollTop=w.scrollHeight;
}
function shTh(){
  var w=document.getElementById('msgs'),d=document.createElement('div');
  d.className='ma';d.id='th';
  d.innerHTML='<div class="ba"><div class="th"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>';
  w.appendChild(d);w.scrollTop=w.scrollHeight;
}
function hiTh(){var e=document.getElementById('th');if(e)e.remove();}

function proc(t){
  if(!t||!t.trim())return;
  aM('u',t);sO('thinking');shTh();
  document.getElementById('sb').disabled=true;
  setTimeout(function(){
    var r=think(t);
    hiTh();aM('a',r);sO('idle');spk(r);
    document.getElementById('sb').disabled=false;
  },500+Math.random()*700);
}
function sT(){var i=document.getElementById('ti'),t=i.value.trim();i.value='';if(t)proc(t);}

// Sesleri yükle
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};
}
sO('idle');
setTimeout(function(){
  var g='Efendim, sistemler tam güçte. JARVIS hazır. Emirlerinizi bekliyorum.';
  aM('a',g);spk(g);
},400);
</script>
